# TD-190-DSR – DSR-557 NEW/UPDATE label catalogs (TC 018/019/020) in the BL-OVL-1 layout – JOB-20261023-05 (dry-run, GET only)
# Why: the 8 QA190 NEW/UPD/BOTH catalogs exist only as old content CFs in /content/dam/ykk/common/product-cf/test/ (seeded 15/10,
#   language-neutral, dates relative to 15/10). The catalog list reads DSR CFs /content/dam/dsr/{lang}/catalogs/ (Martin 22/10,
#   fixtures/dsr-557.ts) → no DSR CF = "Blocked – no DEV data" for 018–020 since 20/10 (IDLE-35/39, JOB-23-04).
# Decision: create content CF /content/dam/common/{lang}/catalogs/{id} + DSR CF /content/dam/dsr/{lang}/catalogs/{id} (ja+en), like the
#   4 core qa190 catalogs (TD-190-CAT-CORE). Old CFs outside the guard are not touched and not referenced.
# Source: JOB-20261016-02 data table (titles, types, date offsets: today / −10 / −11 days; BOTH = pub −1 + upd today; NOUPD = pub −1,
#   no updateDate; UPD publishDate 2026-09-15) + DSR-611 defaults (Q3 open → label window 0–10 days inclusive, "today" = Asia/Tokyo,
#   fixtures/dsr-557.ts labelDays = 10). Other fields = live values of the old CFs (description, thumbnail, pdfAsset, requiresForm false, sortOrder 0).
# DATES ARE FOR AN APPLY + RUN ON 2026-10-23 (JST). Applied/run on another day → regenerate the dates (today, −10, −11, −1).
# [Giả định] catalogCategories = site:product/material/aluminium (old CFs hold "properties:", not a usable tag; value taken from qa190-cat-pdf).
