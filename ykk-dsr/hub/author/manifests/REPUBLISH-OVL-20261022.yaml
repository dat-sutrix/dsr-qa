# REPUBLISH-OVL-20261022 – republish DSR CFs so EDS regenerates the overlay pages after the og:image fix
# (Martin 22/10, dsr-eds PR #206; JOB-20261022-11). Replication only: NO field changes, content CFs not touched.
# Source: GET 22/10 07:08Z, QueryBuilder + CF OpenAPI list of /content/dam/dsr (53 CFs, both sources agree), then
#   cq:lastReplicationAction_{preview,publish} from <path>/jcr:content.json.
# Rule: replicate = exactly the tiers whose action is Activate now. Preview-only stays preview-only (qa654-preview).
#   Never-replicated: none in the guard. Deactivated: none in the guard.
# Exception (needs Claude): en qa587-off + qa587-rel-b have cq:lastReplicationAction_preview=Activate but NO
#   cq:lastReplicated_preview, and the CF API reports previewReplicationStatus=NEVER_PUBLISHED. They are kept publish-only
#   here so .aem.page exposure is not widened. Add preview only if Claude confirms.
# Guard folders with no qa* CF: dsr/{ja,en}/movies/tech, dsr/{ja,en}/products.
# Out of guard (25 DSR CFs, not in this manifest; e.g. dsr/ja/products/990586001/2 → QA-PT tonight): see results/JOB-20261022-11/summary.md.
