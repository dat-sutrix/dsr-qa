# TD-529-META – DSR-529 qa529-01/02 category + robots (fails 012/014/016 of JOB-20261022-02) – JOB-20261023-05 (dry-run, GET only)
# Source: docs/DSR-529/baseline-BL-v1.md TestData TD-529-01 (robots OFF ja+en, "categories") / TD-529-02 (robots ON, ja only),
#         tc-out/DSR-529.spec.json TC 012/014 (meta category only when authored, A13), JOB-20261022-02 summary.
# Live 23/10: qa529-01 ja robots absent (= OFF ✓), en robots "noindex, nofollow" (✗); category absent on both;
#   qa529-02 ja robots absent (✗ TD = ON); en qa529-02 does not exist (TD-529-02 is ja only → no item).
# Page model (component-models.json article-detail-metadata): robots select "" = Indexed (default) | "noindex, nofollow";
#   category = single select news | product | update | event | others.
# [Giả định] category = "product" (both pages carry tag site:product/bio-based). TestData says "categories = 2 tags", which are
#   authored in `tags` already (2 tags ja+en); the page field `category` is a single select, so TC 012 "2 tag IDs" cannot be met
