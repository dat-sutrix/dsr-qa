id: TD-529-META
us: DSR-529
max_writes: 6
items:
  - kind: page
    lang: [ja, en]
    path: /content/sites/digital-showroom/master/{lang}/library/article/stories/qa529-01
    props: { category: product, robots: "" }   # robots "" = OFF (ja: no write, already absent)
    replicate: [publish]
  - kind: page
    lang: [ja]
    lang_pair: false
    lang_pair_reason: "TD-529-02 ja only (TestData en/cn column = —)"
    path: /content/sites/digital-showroom/master/{lang}/library/article/stories/qa529-02
    props: { robots: "noindex, nofollow" }
    replicate: [publish]
verify:
  urls: ["/master/{lang}/library/article/stories/qa529-01", "/master/ja/library/article/stories/qa529-02"]   # pages are served under /master/ on EDS DEV
